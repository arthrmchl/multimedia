name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    COMPOSER_NO_INTERACTION: '1'

jobs:
    tests:
        name: Tests (PHP ${{ matrix.php }})
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']

        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: app
                    # Doctrine ajoute le suffixe « _test » (config/packages/doctrine.yaml).
                    POSTGRES_DB: app_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U app -d app_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            APP_ENV: test
            # Même URL que .env.test ; tests/TestDatabaseTest.php vérifie l'hôte 127.0.0.1.
            DATABASE_URL: 'postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8'

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ matrix.php }}
                  extensions: ctype, iconv, intl, pdo_pgsql
                  coverage: none
                  tools: composer:v2

            - name: Valider composer.json
              run: composer validate --strict --no-check-publish

            - id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

            - name: Installer les dépendances
              run: composer install --no-progress --prefer-dist

            - name: Appliquer les migrations
              # --allow-no-migration : le dépôt peut ne pas encore contenir de migration.
              run: bin/console doctrine:migrations:migrate --env=test -n --allow-no-migration

            - name: PHPUnit
              run: vendor/bin/phpunit

    qualite:
        name: Qualité (analyse statique et linters)
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.5'
                  extensions: ctype, iconv, intl, pdo_pgsql
                  coverage: none
                  tools: composer:v2

            - name: Valider composer.json
              run: composer validate --strict --no-check-publish

            - id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-php8.5-

            - name: Installer les dépendances
              run: composer install --no-progress --prefer-dist

            - name: Audit de sécurité des dépendances
              run: composer audit

            - name: Préchauffer le cache dev (conteneur lu par PHPStan)
              run: bin/console cache:warmup --env=dev

            - name: PHPStan
              run: vendor/bin/phpstan analyse --no-progress

            - name: PHP-CS-Fixer
              run: vendor/bin/php-cs-fixer fix --dry-run --diff

            - name: Twig-CS-Fixer
              run: vendor/bin/twig-cs-fixer lint templates/

            - name: Rector
              run: vendor/bin/rector process --dry-run

            - name: Lint YAML
              run: bin/console lint:yaml config/ --parse-tags

            - name: Lint Twig
              run: bin/console lint:twig templates/

            - name: Lint conteneur
              run: bin/console lint:container
